# ─────────────────────────────────────────────────────────────
# 모니터링 VM (Prometheus + Grafana). stacks/40-mon 이 만든다: make apply-mon (mgmt, nva 다음)
#  - subnet 은 spoke VCN 의 subnet 이름이다. 그 subnet 이 있는 spoke 의 state 를 읽는다.
#  - scrape 대상은 30-nva state 의 trust IP:9100 (VyOS node-exporter) 이다.
#  - 공인 IP 가 없다. Grafana(3000)는 OCI Bastion port forwarding 으로 연다 (terraform output grafana_tunnel).
#  - Grafana 첫 로그인은 admin / admin 이고, 로그인하면 바로 바꾸라고 묻는다.
# ─────────────────────────────────────────────────────────────

mon:
  compartment: MGMT
  subnet: MGMT_MON_PRI_SBN
  private_ip: 10.3.16.10
  shape: VM.Standard.E5.Flex
  ocpus: 1
  memory_gb: 8
  ssh_key_file: ~/.ssh/id_ed25519.pub   # Bastion session 키. VM 에도 넣는다 (파일이 없으면 VM 에는 키 없이 만든다)
  grafana_from: [192.168.10.0/24]       # Bastion 말고 Grafana 에 바로 붙는 대역 (e.g., 본사 VPN)
  bastion_from: [0.0.0.0/0]             # Bastion session 을 열 수 있는 공인 대역. 사무실, 집 IP 로 좁힌다
