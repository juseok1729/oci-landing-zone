# ─────────────────────────────────────────────────────────────
# Object Storage Buckets
#  - 키가 버킷 이름이다 (namespace 내 유일해야 함).
#  - 접근 유형은 항상 NoPublicAccess 로 생성된다.
#  - 객체가 남아 있는 버킷은 destroy 되지 않는다.
# ─────────────────────────────────────────────────────────────

buckets:
  EC-PRD-CONNECTOR-SYSLOG-TO-BUCKET-01:
    compartment: E-COMMERCE
  EC-DEV-CONNECTOR-SYSLOG-TO-BUCKET-01:
    compartment: E-COMMERCE
  ERP-PRD-CONNECTOR-SYSLOG-TO-BUCKET-01:
    compartment: ERP
  ERP-DEV-CONNECTOR-SYSLOG-TO-BUCKET-01:
    compartment: ERP

  MGMT-CONNECTOR-SYSLOG-TO-BUCKET-01:
    compartment: MGMT
  MGMT-BUCKET-AUDIT-LOG-01:
    compartment: MGMT
  MGMT-BUCKET-SERVICE-LOG-01:
    compartment: MGMT

  # 옵션 예시
  # SAMPLE-BUCKET:
  #   compartment: MGMT
  #   storage_tier: Standard     # Standard | Archive
  #   versioning: true           # 기본 false
