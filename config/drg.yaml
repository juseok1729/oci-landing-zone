# ─────────────────────────────────────────────────────────────
# DRG
#  - DRG 생성 시 OCI가 자동으로 만드는 두 개의 route table
#    (Autogenerated Drg Route Table for VCN attachments /
#     ... for RPC, VC, and IPSec attachments)는 여기 적지 않습니다.
#    VCN 파일의 drg_attachment.drg_route_table: autogenerated 로 참조합니다.
#  - DRG attachment는 각 VCN 파일(config/vcns/*.yaml)에 정의합니다.
#  - next_hop 은 DRG attachment 이름입니다.
# ─────────────────────────────────────────────────────────────

drgs:
  HUB_DRG:
    compartment: HUB_COMP

    route_tables:
      # spoke attachment에 붙는 테이블: 모든 트래픽을 HUB로
      DRG_SPOKE_RT:
        rules:
          - destination: 0.0.0.0/0
            next_hop: HUB_DRG_ATT

      # HQ IPSec 연결용 (IPSec 생성 후 해당 attachment에 지정)
      DRG_IPSEC_RT:
        rules:
          - destinations: [10.0.0.0/16, 10.1.0.0/16, 10.2.0.0/16, 10.3.0.0/16]
            next_hop: HUB_DRG_ATT
