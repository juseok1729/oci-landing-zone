# ─────────────────────────────────────────────────────────────
# HUB_VCN (DMZ): FortiGate HA(A-P), WAPPLES HA(A-A)
#
# route rule target 표기법
#   igw:<IGW 이름>          같은 VCN의 Internet Gateway
#   sgw:<SGW 이름>          같은 VCN의 Service Gateway
#   drg:<DRG 이름>          이 VCN이 붙어 있는 DRG
#   privateip:<IP>          같은 VCN 안의 Private IP (FortiGate VIP 등)
#   ocid1.xxx...            OCID 직접 지정
#
# destination 표기법
#   CIDR (10.1.0.0/16)  |  all-services (All ICN Services In OSN)  |  objectstorage
#   spokes              config/vcns 의 hub 외 파일에 있는 VCN CIDR 전부 (자기 VCN 은 빠짐, spoke 추가 시 자동 반영)
#   여러 개면 destinations: [a, b, c]
#
# rule 을 잠시 끄려면 enabled: false
# enabled: auto 는 privateip target 이 실제로 있을 때만 켠다 (NVA 를 만든 뒤 make apply-hub 하면 켜지고, 없으면 빠진다)
# ─────────────────────────────────────────────────────────────

HUB_VCN:
  compartment: HUB
  cidrs: [10.0.0.0/16]
  dns_label: hub

  internet_gateways:
    HUB_IGW: {}

  # 게이트웨이에 붙는 route table 은 그 게이트웨이 아래에 적는다 (subnet 용은 route_tables:).
  #   SGW 용 RT       → target: drg: / privateip: 만 가능 (OCI 제약)
  #   DRG attachment  → target: sgw: / privateip: 만 가능 (OCI 제약)
  service_gateways:
    HUB_SGW:
      services: all-services
      route_table:                       # OSN 응답 → spoke
        name: HUB_SGW_RT
        rules:
          - destination: spokes
            target: drg:HUB_DRG
            description: "OCI 서비스 응답 → spoke VCN"

  drg_attachment:
    name: HUB_DRG_ATT
    drg: HUB_DRG
    drg_route_table: autogenerated       # Autogenerated Drg Route Table for VCN attachments
    route_table:                         # Hub Attachment Transit RT (spoke → HUB 진입 시 적용)
      name: HUB_INGRESS_RT
      rules:
        - destination: all-services
          target: sgw:HUB_SGW
          description: "Hub Attachment Transit RT"

        # DRG_SPOKE_RT 가 spoke 트래픽(0.0.0.0/0)을 전부 HUB로 보내는데,
        # 이 테이블에 FortiGate 로 넘기는 rule 이 없으면 spoke→인터넷,
        # spoke↔spoke(PRD↔MGMT 등) 트래픽은 HUB에서 버려짐.
        # FortiGate trust VIP 로 검사시키려면 아래를 true 로 (FortiGate 배포 후).
        - destination: 0.0.0.0/0
          target: privateip:10.0.16.160
          description: "spoke 인터넷 아웃바운드 → FortiGate trust"
          enabled: auto
        - destination: spokes
          target: privateip:10.0.16.160
          description: "spoke ↔ spoke → FortiGate trust"
          enabled: auto
        - destination: 10.0.64.0/24
          target: privateip:10.0.16.160
          description: "DRG → FortiGate → WAF"
          enabled: auto

  route_tables:                          # subnet 용
    HUB_FW_MGMT_PUB_RT:
      rules:
        - destination: 0.0.0.0/0
          target: igw:HUB_IGW
          description: "FortiGate 관리 · OCI API(SDN Connector Failover) 삭제 금지"
        - destination: 192.168.10.0/24
          target: drg:HUB_DRG
          description: "HQ VPN 내부망"

    HUB_FW_UNTRUST_PUB_RT:
      rules:
        - destination: 0.0.0.0/0
          target: igw:HUB_IGW
          description: "FortiGate SNAT 후 인터넷 아웃바운드 (삭제 금지)"

    HUB_FW_TRUST_PRI_RT:
      rules:
        - destination: spokes
          target: drg:HUB_DRG
          description: "검사 후 spoke VCN"
        - destination: 192.168.10.0/24
          target: drg:HUB_DRG
          description: "HQ VPN 내부망"
        - destination: all-services
          target: sgw:HUB_SGW
          description: "검사 후 OCI 서비스"

    HUB_FW_WAF_PRI_RT:
      rules:
        # private IP target은 해당 IP가 실제로 존재해야 조회된다 → enabled: auto (NVA 배포 후 make apply-hub 때 켜짐)
        - destination: 0.0.0.0/0
          target: privateip:10.0.16.160
          description: "FortiGate port3"
          enabled: auto
        - destination: all-services
          target: sgw:HUB_SGW

    HUB_DNS_PRI_RT:
      rules:
        - destination: 192.168.10.0/24
          target: drg:HUB_DRG
          description: "HQ VPN 내부망"

  subnets:
    HUB_FW_UNTRUST_PUB_SBN:
      cidr: 10.0.0.0/24
      public: true
      route_table: HUB_FW_UNTRUST_PUB_RT
      security_lists: [default, HUB_FW_UNTRUST_SL]
      dns_label: fwuntrust

    HUB_FW_TRUST_PRI_SBN:
      cidr: 10.0.16.0/24
      route_table: HUB_FW_TRUST_PRI_RT
      security_lists: [default, HUB_FW_TRUST_SL]
      dns_label: fwtrust

    HUB_FW_MGMT_PUB_SBN:
      cidr: 10.0.32.0/24
      public: true
      route_table: HUB_FW_MGMT_PUB_RT
      security_lists: [default, HUB_FW_MGMT_SL]
      dns_label: fwmgmt

    HUB_FW_HA_PRI_SBN:
      cidr: 10.0.48.0/28
      dns_label: fwha

    HUB_WAF_PRI_SBN:
      cidr: 10.0.64.0/24
      route_table: HUB_FW_WAF_PRI_RT
      dns_label: waf

    HUB_DNS_PRI_SBN:
      cidr: 10.0.80.0/24
      route_table: HUB_DNS_PRI_RT
      security_lists: [default, HUB_DNS_SL]
      dns_label: dns

  # Security List
  security_lists:
    HUB_DNS_SL: 
      ingress:
        - { source: 192.168.10.0/24, protocol: udp, port: "53", stateless: true, description: "HQ → DNS listener (UDP)" }
        - { source: 192.168.10.0/24, protocol: tcp, port: "53", description: "HQ → DNS listener (TCP)" }
    HUB_FW_MGMT_SL:
      ingress:
        - { source: 0.0.0.0/0, protocol: tcp, port: "443", description: "관리 GUI" }
    HUB_FW_UNTRUST_SL:
      ingress:
        - { source: 0.0.0.0/0, protocol: tcp, port: "443", description: "HTTPS Open" }
        - { source: 0.0.0.0/0, protocol: tcp, port: "80", description: "HTTP Open" }
      # FortiGate IPSec VPN(IKE/NAT-T)포트, OCI VPN만 사용할경우 아래 룰은 필요없다.
      #  - { source: 0.0.0.0/0, protocol: udp, port: "4500", description: "FortiGate IKE" }
      #  - { source: 0.0.0.0/0, protocol: udp, port: "500", description: "FortiGate IKE" }
    HUB_FW_TRUST_SL:
      ingress:
        - { source: 10.0.0.0/14, description: "스포크 간 트래픽과 스포크→외부 트래픽 통과용. 실제 제어는 FortiGate 정책에서" }
        - { source: 192.168.10.0/24, description: "HQ 트래픽 유입" }

  # NSG
  network_security_groups:
    HUB_WAF_LB_NSG:
      ingress:
        - { source: 0.0.0.0/0, protocol: tcp, port: "443", description: "HTTPS Open" }
        - { source: 0.0.0.0/0, protocol: tcp, port: "80", description: "HTTP Open" }
      egress:
        - { destination: nsg:HUB_WAF_NSG, protocol: tcp, port: "5000", description: "WAPPLES 헬스체크 포트" }
        - { destination: nsg:HUB_WAF_NSG, protocol: tcp, port: "80", description: "WAPPLES 백엔드 포트" }
    HUB_WAF_NSG:
      ingress:
        - { source: nsg:HUB_WAF_LB_NSG, protocol: tcp, port: "5000", description: "WAPPLES 헬스체크 포트" }
        - { source: nsg:HUB_WAF_LB_NSG, protocol: tcp, port: "80", description: "WAPPLES 백엔드 포트" }
        - { source: 192.168.10.0/24, protocol: tcp, port: "5001", description: "WAPPLES 관리자 콘솔 UI 포트" }
