ERP_PRD_VCN:
  compartment: ERP
  cidrs: [10.4.0.0/16]
  dns_label: erpprd

  drg_attachment:
    name: ERP_PRD_DRG_ATT
    drg: HUB_DRG
    drg_route_table: DRG_SPOKE_RT

  route_tables:
    ERP_PRD_RT:
      rules:
        - destination: 0.0.0.0/0
          target: drg:HUB_DRG
          description: "인터넷/OCI 서비스 → HUB"
          enabled: true

  subnets:
    ERP_PRD_LB_PRI_SBN:
      cidr: 10.4.0.0/24
      route_table: ERP_PRD_RT
      dns_label: erpprdlb
    ERP_PRD_WEB_PRI_SBN:
      cidr: 10.4.16.0/24
      route_table: ERP_PRD_RT
      dns_label: erpprdweb
    ERP_PRD_ADMIN_PRI_SBN:
      cidr: 10.4.32.0/24
      route_table: ERP_PRD_RT
      dns_label: erpprdadmin
    ERP_PRD_CACHE_PRI_SBN:
      cidr: 10.4.48.0/24
      route_table: ERP_PRD_RT
      dns_label: erpprdcache
    ERP_PRD_DB_PRI_SBN:
      cidr: 10.4.64.0/24
      route_table: ERP_PRD_RT
      dns_label: erpprddb

  network_security_groups:
    ERP_PRD_HQ_SSH_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "22022", description: "HQ SSH" }
    ERP_PRD_MYSQL_DB_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "3306", description: "HQ TEST" }
        - { source: 10.4.16.0/24, protocol: tcp, port: "3306", description: "운영 WEB 서버 MYSQL DB 접속" }
        - { source: 10.4.32.0/24, protocol: tcp, port: "3306", description: "운영 ADMIN 서버 MYSQL DB 접속" }
    ERP_PRD_CACHE_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "6379", description: "HQ TEST" }
        - { source: 10.4.16.0/24, protocol: tcp, port: "6379", description: "운영 WEB 서버 VALKEY 접속" }
        - { source: 10.4.32.0/24, protocol: tcp, port: "6379", description: "운영 ADMIN 서버 VALKEY 접속" }
        - { source: 10.4.48.0/24, protocol: tcp, port: "6379", description: "OCI Cache Cluster" }
