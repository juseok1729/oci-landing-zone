EC_DEV_VCN:
  compartment: E-COMMERCE
  cidrs: [10.2.0.0/16]
  dns_label: ecdev

  service_gateways:
    EC_DEV_SGW:
      services: all-services

  drg_attachment:
    name: EC_DEV_DRG_ATT
    drg: HUB_DRG
    drg_route_table: DRG_SPOKE_RT

  route_tables:
    EC_DEV_RT:
      rules:
        - destination: all-services
          target: sgw:EC_DEV_SGW
          description: "OCI 서비스 → 자기 SGW (hub 를 거치지 않음)"
        - destination: 0.0.0.0/0
          target: drg:HUB_DRG
          description: "인터넷 → HUB"
          enabled: true

  subnets:
    EC_DEV_LB_PRI_SBN:
      cidr: 10.2.0.0/24
      route_table: EC_DEV_RT
      dns_label: ecdevlb
    EC_DEV_WEB_PRI_SBN:
      cidr: 10.2.16.0/24
      route_table: EC_DEV_RT
      dns_label: ecdevweb
    EC_DEV_ADMIN_PRI_SBN:
      cidr: 10.2.32.0/24
      route_table: EC_DEV_RT
      dns_label: ecdevadmin
    EC_DEV_CACHE_PRI_SBN:
      cidr: 10.2.48.0/24
      route_table: EC_DEV_RT
      dns_label: ecdevcache
    EC_DEV_DB_PRI_SBN:
      cidr: 10.2.64.0/24
      route_table: EC_DEV_RT
      dns_label: ecdevdb

  network_security_groups:
    EC_DEV_HQ_SSH_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "22022", description: "HQ SSH" }
    EC_DEV_MYSQL_DB_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "3306", description: "HQ TEST" }
        - { source: 10.2.16.0/24, protocol: tcp, port: "3306", description: "개발 WEB 서버 MYSQL DB 접속" }
        - { source: 10.2.32.0/24, protocol: tcp, port: "3306", description: "개발 ADMIN 서버 MYSQL DB 접속" }
    EC_DEV_CACHE_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "6379", description: "HQ TEST" }
        - { source: 10.2.16.0/24, protocol: tcp, port: "6379", description: "개발 WEB 서버 VALKEY 접속" }
        - { source: 10.2.32.0/24, protocol: tcp, port: "6379", description: "개발 ADMIN 서버 VALKEY 접속" }
        - { source: 10.2.48.0/24, protocol: tcp, port: "6379", description: "OCI Cache Cluster" }
