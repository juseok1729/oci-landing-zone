DEV_VCN:
  compartment: DEV_COMP
  cidrs: [10.2.0.0/16]
  dns_label: dev

  drg_attachment:
    name: DEV_DRG_ATT
    drg: HUB_DRG
    drg_route_table: DRG_SPOKE_RT

  route_tables:
    DEV_RT:
      rules:
        - destination: 0.0.0.0/0
          target: drg:HUB_DRG
          description: "인터넷/OCI 서비스 → HUB"
          enabled: true

  subnets:
    DEV_LB_PRI_SBN:
      cidr: 10.2.0.0/24
      route_table: DEV_RT
      dns_label: lb
    DEV_WEB_PRI_SBN:
      cidr: 10.2.16.0/24
      route_table: DEV_RT
      dns_label: web
    DEV_ADMIN_PRI_SBN:
      cidr: 10.2.32.0/24
      route_table: DEV_RT
      dns_label: admin
    DEV_CACHE_PRI_SBN:
      cidr: 10.2.48.0/24
      route_table: DEV_RT
      dns_label: cache
    DEV_DB_PRI_SBN:
      cidr: 10.2.64.0/24
      route_table: DEV_RT
      dns_label: db

  network_security_groups:
    DEV_HQ_SSH_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "22022", description: "HQ SSH" }
    DEV_MYSQL_DB_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "3306", description: "HQ TEST" }
        - { source: 10.2.16.0/24, protocol: tcp, port: "3306", description: "개발 WEB 서버 MYSQL DB 접속" }
        - { source: 10.2.32.0/24, protocol: tcp, port: "3306", description: "개발 ADMIN 서버 MYSQL DB 접속" }
    DEV_CACHE_NSG:
      ingress:
        - { source: 192.168.10.0/24, protocol: tcp, port: "6379", description: "HQ TEST" }
        - { source: 10.2.16.0/24, protocol: tcp, port: "6379", description: "개발 WEB 서버 VALKEY 접속" }
        - { source: 10.2.32.0/24, protocol: tcp, port: "6379", description: "개발 ADMIN 서버 VALKEY 접속" }
        - { source: 10.2.48.0/24, protocol: tcp, port: "6379", description: "OCI Cache Cluster" }
